name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: trm-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: trm-macos-x86_64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: trm-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package tarball
        run: |
          tar -czf ${{ matrix.asset }} -C target/${{ matrix.target }}/release trm
          shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          title=$(awk -v prefix="## ${GITHUB_REF_NAME}" '
            BEGIN { len = length(prefix) }
            substr($0, 1, len) == prefix && (length($0) == len || substr($0, len + 1, 1) == " ") {
              print substr($0, 4)
              exit
            }
          ' CHANGELOG.md)
          echo "title=${title:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

          awk -v prefix="## ${GITHUB_REF_NAME}" '
            BEGIN { len = length(prefix) }
            substr($0, 1, len) == prefix && (length($0) == len || substr($0, len + 1, 1) == " ") {
              found = 1
              next
            }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/*

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: release-*
      - name: Checkout homebrew-tap
        if: env.HAS_KEY == 'true'
        env:
          HAS_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
        uses: actions/checkout@v5
        with:
          repository: misbeliever/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Update Formula/trm.rb and push
        env:
          HAS_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::HOMEBREW_TAP_DEPLOY_KEY not set; skipping homebrew-tap update."
            exit 0
          fi
          python3 - <<'PY'
          import os, pathlib, re

          ver = os.environ["VERSION"].lstrip("v")
          sha = lambda name: pathlib.Path(f"dist/{name}.sha256").read_text().split()[0]
          arm64 = sha("trm-macos-arm64.tar.gz")
          x86_64 = sha("trm-macos-x86_64.tar.gz")
          linux = sha("trm-linux-x86_64.tar.gz")

          path = pathlib.Path("tap/Formula/trm.rb")
          text = path.read_text()
          text = re.sub(r'(^\s*version ")[^"]+(")', rf'\g<1>{ver}\2', text, count=1, flags=re.M)
          text = re.sub(r'(trm-macos-arm64\.tar\.gz"\n\s*sha256 ")[^"]+(")', rf'\g<1>{arm64}\2', text, count=1)
          text = re.sub(r'(trm-macos-x86_64\.tar\.gz"\n\s*sha256 ")[^"]+(")', rf'\g<1>{x86_64}\2', text, count=1)
          text = re.sub(r'(trm-linux-x86_64\.tar\.gz"\n\s*sha256 ")[^"]+(")', rf'\g<1>{linux}\2', text, count=1)
          path.write_text(text)
          PY
          git -C tap config user.name "misbeliever"
          git -C tap config user.email "902082+misbeliever@users.noreply.github.com"
          git -C tap diff --quiet && exit 0
          git -C tap add Formula/trm.rb
          git -C tap commit -m "chore: update trm formula to ${VERSION}"
          git -C tap push origin main
