name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: trm-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: trm-macos-x86_64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: trm-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package tarball
        run: |
          tar -czf ${{ matrix.asset }} -C target/${{ matrix.target }}/release trm
          shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          title=$(awk -v prefix="## ${GITHUB_REF_NAME}" '
            BEGIN { len = length(prefix) }
            substr($0, 1, len) == prefix && (length($0) == len || substr($0, len + 1, 1) == " ") {
              print substr($0, 4)
              exit
            }
          ' CHANGELOG.md)
          echo "title=${title:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

          awk -v prefix="## ${GITHUB_REF_NAME}" '
            BEGIN { len = length(prefix) }
            substr($0, 1, len) == prefix && (length($0) == len || substr($0, len + 1, 1) == " ") {
              found = 1
              next
            }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/*
